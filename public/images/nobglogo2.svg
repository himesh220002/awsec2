<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <!-- <radialGradient id="cyber-bg" cx="50%" cy="50%" r="70%"> -->
      <!-- <stop offset="0%" stop-color="#0c131c" /> -->
      <!-- <stop offset="55%" stop-color="#05080d" /> -->
      <!-- <stop offset="100%" stop-color="#020305" /> -->
    <!-- </radialGradient> -->

    <!-- Translucent Inner Goblet Glass Gradient -->
    <linearGradient id="chalice-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff4ed" />
      <stop offset="50%" stop-color="#cfdcd4" />
      <stop offset="85%" stop-color="#73867c" />
      <stop offset="100%" stop-color="#24332c" />
    </linearGradient>

    <!-- Metallic Pewter / Antique Dark Silver Shading -->
    <linearGradient id="metal-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#c1cbcf" />
      <stop offset="60%" stop-color="#49555c" />
      <stop offset="100%" stop-color="#14181a" />
    </linearGradient>

    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556066" />
      <stop offset="60%" stop-color="#22282c" />
      <stop offset="100%" stop-color="#0b0e10" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="1" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.8" opacity="0.38" />
    </pattern>

    <!-- Dynamic Glitch Distortion Filter -->
    <filter id="glitch-distort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.85" numOctaves="1" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- FULL TRIWIZARD CUP VECTOR STRUCTURE -->
    <g id="trophy-cup">
      <!-- 1. DRAGON WING/BODY HANDLES -->
      <!-- Left Dragon Handle -->
      <path d="M 165 72 
               C 105 32, 45 68, 42 128 
               C 39 184, 88 228, 122 256 
               C 134 266, 128 285, 115 292
               C 132 288, 146 270, 138 248
               C 112 214, 62 182, 66 128
               C 70 82, 120 58, 165 84 Z" 
            fill="url(#metal-sheen)" />
      <!-- Left Dragon Head & Horn Spines -->
      <!-- <path d="M 165 70 C 180 58, 202 52, 206 42 C 186 42, 172 48, 162 55 L 148 38 L 148 55 Z" fill="url(#metal-sheen)" /> -->
      <!-- <path d="M 180 62 L 200 66 L 188 74 Z" fill="#14181a" /> -->
      <!-- Scale Carvings Left -->
      <!-- <path d="M 68 110 Q 78 116 80 130 M 74 135 Q 86 142 88 158 M 90 162 Q 104 172 108 190"  -->
            <!-- stroke="#161c20" stroke-width="2" fill="none" opacity="0.7" /> -->

      <!-- Right Dragon Handle -->
      <path d="M 335 72 
               C 395 32, 455 68, 458 128 
               C 461 184, 412 228, 378 256 
               C 366 266, 372 285, 385 292
               C 368 288, 354 270, 362 248
               C 388 214, 438 182, 434 128
               C 430 82, 380 58, 335 84 Z" 
            fill="url(#metal-sheen)" />
      <!-- Right Dragon Head & Horn Spines -->
      <!-- <path d="M 335 70 C 320 58, 298 52, 294 42 C 314 42, 328 48, 338 55 L 352 38 L 352 55 Z" fill="url(#metal-sheen)" /> -->
      <!-- <path d="M 320 62 L 300 66 L 312 74 Z" fill="#14181a" /> -->
      <!-- Scale Carvings Right -->
      <path d="M 432 110 Q 422 116 420 130 M 426 135 Q 414 142 412 158 M 410 162 Q 396 172 392 190" 
            stroke="#161c20" stroke-width="2" fill="none" opacity="0.7" />

      <!-- Center Crest Serpent Peak -->
      <path d="M 242 70 C 242 50, 246 38, 250 36 C 254 38, 258 50, 258 70 Z" fill="url(#metal-sheen)" />

      <!-- 2. GOBLET BOWL & INNER RUNES -->
      <!-- Chalice Glass Vessel -->
      <path d="M 155 80 L 345 80 L 320 240 C 295 272, 205 272, 180 240 Z" fill="url(#chalice-glass)" />

      <!-- Inner Arcane Flakes & Dark Wisps inside Glass -->
      <g fill="#18241d" opacity="0.8">
        <path d="M 245 108 L 248 116 L 253 118 L 247 122 L 250 130 L 243 124 L 238 126 L 242 118 Z" />
        <path d="M 218 152 Q 225 168 214 180 Q 230 172 238 186 Q 232 165 218 152 Z" />
        <path d="M 275 145 Q 262 160 274 175 Q 282 162 292 178 Q 285 155 275 145 Z" />
        <path d="M 180 120 Q 192 135 185 160 Q 198 140 205 180 L 195 190 Q 185 150 178 135 Z" opacity="0.6" />
        <path d="M 320 120 Q 308 135 315 160 Q 302 140 295 180 L 305 190 Q 315 150 322 135 Z" opacity="0.6" />
      </g>

      <!-- Faint Gothic Glass Inscription: "T R I   W I Z A R D" -->
      <text x="250" y="148" text-anchor="middle" font-family="'Times New Roman', serif" font-size="20" letter-spacing="2" fill="#1b241e" opacity="0.88">CHAMPIONS</text>

      <!-- Arching Scalloped Silver Upper Rim -->
      <path d="M 152 78 Q 170 78 188 78 Q 206 78 224 78 Q 237 78 250 78 Q 263 78 276 78 Q 294 78 312 78 Q 330 78 348 78 L 348 88 Q 330 88 312 88 Q 294 88 276 88 Q 263 88 250 88 Q 237 88 224 88 Q 206 88 188 88 Q 170 88 152 88 Z" fill="url(#metal-sheen)" />

      <!-- Chalice Vertical Frame Ribs & Claws -->
      <path d="M 198 84 L 202 235 L 192 242 L 194 84 Z" fill="#D4AF37" />
      <path d="M 298 84 L 302 235 L 308 242 L 306 84 Z" fill="#D4AF37" />
      
      <!-- Thorny Root Branches embracing the cup bottom -->
      <g stroke="url(#metal-sheen)" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path d="M 250 270 Q 235 235 220 220 Q 205 205 195 210" />
        <path d="M 230 240 Q 242 225 240 205" />
        <path d="M 250 270 Q 265 235 280 220 Q 295 205 305 210" />
        <path d="M 270 240 Q 258 225 260 205" />
      </g>
      <polygon points="180,240 188,272 198,252" fill="url(#metal-sheen)" />
      <polygon points="320,240 312,272 302,252" fill="url(#metal-sheen)" />
      <polygon points="250,250 244,276 256,276" fill="url(#metal-sheen)" />

      <!-- 3. STEM & COILING SERPENT -->
      <rect x="237" y="272" width="26" height="42" fill="url(#metal-dark)" />
      <ellipse cx="250" cy="314" rx="22" ry="6" fill="url(#metal-sheen)" />

      <!-- Fluted Tapered Neck -->
      <polygon points="230,320 270,320 286,410 214,410" fill="#D4AF37" />
      <polygon points="230,320 236,410 214,410" fill="url(#metal-dark)" opacity="0.4" />

      <!-- Serpent body winding tightly down the neck -->
      <path d="M 232 284 
               C 272 288, 276 312, 242 328 
               C 216 338, 220 376, 268 382 
               C 284 388, 280 408, 240 416" 
            fill="none" stroke="url(#metal-sheen)" stroke-width="13" stroke-linecap="round" />
      <path d="M 232 284 
               C 272 288, 276 312, 242 328 
               C 216 338, 220 376, 268 382 
               C 284 388, 280 408, 240 416" 
            fill="none" stroke="#0e1317" stroke-width="3" stroke-dasharray="2 3.5" stroke-linecap="round" />

      <!-- Dragon Head Crouched at Base Foot -->
      <path d="M 205 418 C 185 412, 172 428, 160 435 C 178 430, 195 426, 216 428 Z" fill="url(#metal-sheen)" />
      <polygon points="172,426 156,432 170,436" fill="#14181a" />

      <!-- 4. HEAVY STEPPED OCTAGONAL BASE -->
      <polygon points="204,410 296,410 306,424 194,424" fill="url(#metal-dark)" />
      <polygon points="190,424 310,424 322,436 178,436" fill="url(#metal-sheen)" />
      <polygon points="174,436 326,436 342,448 158,448" fill="url(#metal-dark)" />
      <!-- Flared Bottom Plinth Steps -->
      <polygon points="144,448 356,448 380,470 120,470" fill="url(#metal-sheen)" />
      <polygon points="116,470 384,470 394,478 106,478" fill="#080b0e" />

      <!-- Grooved Layer Ridges on Base -->
      <line x1="135" y1="454" x2="365" y2="454" stroke="#161c20" stroke-width="1.2" />
      <line x1="128" y1="462" x2="372" y2="462" stroke="#161c20" stroke-width="1.2" />
    </g>
  </defs>

  <!-- 1. BASE CANVAS BACKGROUND -->
  <!-- <rect width="100%" height="100%" fill="url(#cyber-bg)" /> -->

  <!-- 2. CYBER HUD MATRIX GRID & CROSSHAIRS -->
  <!-- <g stroke="#00f0ff" stroke-width="10.5" opacity="10.12"> -->
    <!-- <line x1="45" y1="0" x2="45" y2="500" /> -->
    <!-- <line x1="130" y1="0" x2="130" y2="500" /> -->
    <!-- <line x1="250" y1="0" x2="250" y2="500" stroke-dasharray="3 6" stroke-width="0.7" /> -->
