    <!-- <line x1="455" y1="0" x2="455" y2="500" /> -->
    <!-- <line x1="0" y1="78" x2="500" y2="78" /> -->
    <!-- <line x1="0" y1="135" x2="500" y2="135" stroke-dasharray="6 3" /> -->
    <!-- <line x1="0" y1="260" x2="500" y2="260" /> -->
    <!-- <line x1="0" y1="424" x2="500" y2="424" /> -->
  <!-- </g> -->
  <!-- HUD Targeting Markers -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.35">
    <path d="M 85 165 L 85 175 M 80 170 L 90 170" />
    <path d="M 415 165 L 415 175 M 410 170 L 420 170" />
    <path d="M 415 325 L 415 335 M 410 330 L 420 330" />
    <path d="M 85 325 L 85 335 M 80 330 L 90 330" />
  </g>

  <!-- 3. CHROMATIC RGB CHANNELS (GLITCH SHIFT) -->
  <!-- Cyan Screen Channel (Offset Left / Down) -->
  <g color="#00f0ff" transform="translate(-8, 3)" opacity="0.75" style="mix-blend-mode: screen;" filter="url(#glitch-distort)">
    <use href="#trophy-cup" />
  </g>

  <!-- Magenta Screen Channel (Offset Right / Up) -->
  <g color="#ff0055" transform="translate(8, -3)" opacity="0.75" style="mix-blend-mode: screen;" filter="url(#glitch-distort)">
    <use href="#trophy-cup" />
  </g>

  <!-- 4. CORE SHARP TROPHY OVERLAY -->
  <use href="#trophy-cup" />

  <!-- 5. MATCHED GLITCH BANDS & HORIZONTAL DISPLACEMENTS -->
  <!-- Upper Left Wing Break -->
  <rect x="35" y="65" width="80" height="6" fill="#00f0ff" opacity="0.85" transform="translate(-12, 0)" />
  <rect x="50" y="71" width="40" height="4" fill="#ff0055" opacity="0.8" transform="translate(10, 0)" />

  <!-- Goblet Center Crack Displacement (Direct match to reference horizontal cut) -->
  <rect x="235" y="122" width="130" height="5" fill="#ffffff" opacity="0.95" transform="translate(26, 0)" />
  <rect x="320" y="132" width="55" height="5" fill="#00f0ff" opacity="0.85" transform="translate(38, 0)" />

  <!-- Mid Chalice Splice -->
  <rect x="95" y="185" width="90" height="8" fill="#00f0ff" opacity="0.75" transform="translate(16, 0)" />
  <rect x="110" y="185" width="60" height="8" fill="url(#metal-sheen)" opacity="0.95" transform="translate(-14, 0)" />

  <!-- Stem Offset Slice -->
  <rect x="185" y="325" width="130" height="5" fill="#ff0055" opacity="0.8" transform="translate(-18, 0)" />

  <!-- Pedestal Glitch Slice Block -->
  <rect x="180" y="394" width="145" height="18" fill="#ffffff" opacity="0.25" transform="translate(24, 0)" />
  <rect x="195" y="394" width="115" height="18" fill="#00f0ff" opacity="0.3" transform="translate(-16, 0)" />

  <!-- 6. FLOATING CYBER DEBRIS & PIXEL MATRIX PARTICLES -->
  <g fill="#00f0ff" opacity="0.85">
    <rect x="44" y="80" width="8" height="3" />
    <rect x="50" y="102" width="14" height="2" />
    <rect x="425" y="52" width="10" height="3" />
    <rect x="440" y="72" width="18" height="3" />
    <rect x="428" y="82" width="4" height="4" />
    <rect x="135" y="275" width="12" height="3" />
    <rect x="365" y="275" width="18" height="3" />
    <rect x="142" y="425" width="16" height="3" />
    <rect x="340" y="450" width="22" height="3" />
    <rect x="125" y="465" width="28" height="4" />
  </g>
  <g fill="#ff0055" opacity="0.85">
    <rect x="448" y="110" width="15" height="3" />
    <rect x="410" y="45" width="12" height="2.5" />
    <rect x="62" y="145" width="16" height="3" />
    <rect x="382" y="180" width="14" height="3" />
    <rect x="160" y="370" width="20" height="3" />
    <rect x="360" y="460" width="24" height="3" />
  </g>

  <!-- 7. CRT SCANLINE SCREEN OVERLAY -->
  <rect width="100%" height="100%" fill="url(#scanlines)" pointer-events="none" />
</svg>
