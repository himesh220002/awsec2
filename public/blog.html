<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOG — Vice City Stories</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { vice: { pink: '#ff2e88', cyan: '#00e5ff', purple: '#7b2ff7', bg: '#0b0614' } },
          fontFamily: { archivo: ['Archivo', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Archivo', system-ui, sans-serif; }
    .sunset {
      background:
        radial-gradient(ellipse 80% 55% at 50% 110%, rgba(255,46,136,.45), transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 105%, rgba(255,140,0,.35), transparent 60%),
        radial-gradient(ellipse 50% 35% at 85% -5%, rgba(0,229,255,.18), transparent 60%),
        radial-gradient(ellipse 50% 35% at 10% 0%, rgba(123,47,247,.25), transparent 60%),
        linear-gradient(180deg, #0b0614 0%, #1a0b2e 55%, #2d0a2e 100%);
    }
    .grid-lines {
      background-image: linear-gradient(rgba(0,229,255,.6) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.6) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent);
    }
    .hero-title {
      background: linear-gradient(180deg, #fff 20%, #ff2e88 55%, #7b2ff7 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 26px rgba(255,46,136,.45));
    }
    .logo-text {
      background: linear-gradient(90deg, #ff2e88, #00e5ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
  </style>
</head>
<body class="bg-vice-bg text-white min-h-screen overflow-x-hidden">

  <div class="sunset fixed inset-0 -z-20"></div>
  <div class="grid-lines fixed inset-0 -z-10 opacity-[0.14]"></div>

  <nav class="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-3 px-4 sm:px-8 py-4 bg-[#0b0614]/70 backdrop-blur-xl border-b border-vice-pink/40">
    <a href="/" class="logo-text font-black text-xl sm:text-2xl tracking-widest no-underline">VICE/BLOG</a>
    <div class="flex flex-wrap gap-1 sm:gap-2">
      <a href="/" class="text-white no-underline font-bold text-xs tracking-widest uppercase px-3 sm:px-4 py-2 rounded-full border border-transparent transition hover:text-vice-pink hover:border-vice-pink hover:shadow-[0_0_18px_rgba(255,46,136,.45)]">Home</a>
      <a href="/blog" class="text-vice-pink no-underline font-bold text-xs tracking-widest uppercase px-3 sm:px-4 py-2 rounded-full border border-vice-pink shadow-[0_0_18px_rgba(255,46,136,.45)]">Blog</a>
      <a href="/about" class="text-white no-underline font-bold text-xs tracking-widest uppercase px-3 sm:px-4 py-2 rounded-full border border-transparent transition hover:text-vice-pink hover:border-vice-pink hover:shadow-[0_0_18px_rgba(255,46,136,.45)]">About</a>
      <a href="/contact" class="text-white no-underline font-bold text-xs tracking-widest uppercase px-3 sm:px-4 py-2 rounded-full border border-transparent transition hover:text-vice-pink hover:border-vice-pink hover:shadow-[0_0_18px_rgba(255,46,136,.45)]">Contact</a>
    </div>
  </nav>

  <section class="text-center px-4 pt-12 sm:pt-16 pb-6">
    <span class="inline-block text-[0.7rem] font-bold tracking-[4px] uppercase text-vice-cyan border border-vice-cyan/50 rounded-full px-4 py-1.5 mb-5 shadow-[0_0_18px_rgba(0,229,255,.3)]">Leonida Stories</span>
    <h1 class="hero-title font-black uppercase leading-[0.95] tracking-tight text-[clamp(2.6rem,9vw,5.5rem)]">Vice<br>City Blog</h1>
    <p class="mt-4 text-white/70 text-base sm:text-lg">Dispatches from the neon streets — Docker, CI/CD &amp; EC2.</p>
  </section>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 pb-16 pt-6">
    <div id="posts" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <p class="text-white/60 text-center col-span-full">Loading stories from the city…</p>
    </div>
  </main>

  <footer class="text-center px-4 py-8 text-white/50 text-xs sm:text-sm tracking-widest border-t border-vice-pink/25">
    <p>&copy; 2026 <span class="text-vice-pink font-bold">VICE/BLOG</span> — WELCOME TO LEONIDA</p>
  </footer>

  <script>
    fetch('/api/posts')
      .then(res => res.json())
      .then(posts => {
        document.getElementById('posts').innerHTML = posts.map(p => `
          <article class="relative overflow-hidden rounded-[20px] p-6 sm:p-7 bg-white/[0.06] border border-white/10 backdrop-blur-md transition duration-300 hover:-translate-y-2 hover:shadow-[0_20px_50px_rgba(255,46,136,.3)]">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-vice-pink via-vice-purple to-vice-cyan"></div>
            <h2 class="text-lg sm:text-xl font-black uppercase mb-2">${p.title}</h2>
            <small class="text-vice-cyan font-bold text-[0.7rem] tracking-[2px] uppercase">${p.date}</small>
            <p class="mt-3 text-vice-pink font-bold text-sm sm:text-base">${p.excerpt}</p>
            <p class="mt-2 text-white/75 text-sm">${p.content}</p>
          </article>
        `).join('');
      })
      .catch(() => {
        document.getElementById('posts').innerHTML = '<p class="text-white/60 text-center col-span-full">Failed to load stories.</p>';
      });
  </script>
</body>
</html>
