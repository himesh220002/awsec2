<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOG — Vice City Stories</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --pink: #ff2e88;
      --cyan: #00e5ff;
      --purple: #7b2ff7;
      --bg: #0b0614;
      --card: rgba(255, 255, 255, 0.06);
    }
    body {
      font-family: 'Archivo', system-ui, sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Vice-city sunset backdrop */
    .sunset {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse 80% 55% at 50% 110%, rgba(255, 46, 136, 0.45), transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 105%, rgba(255, 140, 0, 0.35), transparent 60%),
        radial-gradient(ellipse 50% 35% at 85% -5%, rgba(0, 229, 255, 0.18), transparent 60%),
        radial-gradient(ellipse 50% 35% at 10% 0%, rgba(123, 47, 247, 0.25), transparent 60%),
        linear-gradient(180deg, #0b0614 0%, #1a0b2e 55%, #2d0a2e 100%);
    }
    .grid-lines {
      position: fixed; inset: 0; z-index: -1; opacity: 0.14;
      background-image: linear-gradient(rgba(0,229,255,.6) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.6) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent);
    }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2rem; flex-wrap: wrap; gap: 0.75rem;
      background: rgba(11, 6, 20, 0.7); backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 46, 136, 0.35);
      position: sticky; top: 0; z-index: 10;
    }
    .logo {
      font-weight: 900; font-size: 1.4rem; letter-spacing: 2px;
      background: linear-gradient(90deg, var(--pink), var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-decoration: none;
    }
    .links { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    .links a {
      color: #fff; text-decoration: none; font-weight: 700; font-size: 0.85rem;
      letter-spacing: 1px; text-transform: uppercase;
      padding: 0.5rem 0.9rem; border-radius: 999px;
      border: 1px solid transparent; transition: 0.25s;
    }
    .links a:hover, .links a.active {
      border-color: var(--pink); color: var(--pink);
      box-shadow: 0 0 18px rgba(255, 46, 136, 0.45);
    }
    .hero { text-align: center; padding: 4rem 1.5rem 2rem; }
    .kicker {
      display: inline-block; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 4px; text-transform: uppercase; color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 999px;
      padding: 0.4rem 1rem; margin-bottom: 1.25rem;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.3);
    }
    .hero h1 {
      font-size: clamp(2.6rem, 9vw, 5.5rem); font-weight: 900;
      line-height: 0.95; letter-spacing: -1px; text-transform: uppercase;
      background: linear-gradient(180deg, #fff 20%, var(--pink) 55%, var(--purple) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 26px rgba(255, 46, 136, 0.45));
    }
    .hero p { margin-top: 1rem; color: rgba(255,255,255,0.7); font-size: 1.05rem; }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    #posts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .post {
      background: var(--card); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; padding: 1.75rem; position: relative; overflow: hidden;
      backdrop-filter: blur(10px); transition: transform 0.3s, box-shadow 0.3s;
    }
    .post::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
    }
    .post:hover { transform: translateY(-8px); box-shadow: 0 20px 50px rgba(255, 46, 136, 0.3); }
    .post h2 { font-size: 1.35rem; font-weight: 900; text-transform: uppercase; margin-bottom: 0.4rem; }
    .post small {
      color: var(--cyan); font-weight: 700; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase;
    }
    .post .excerpt { margin-top: 0.9rem; color: var(--pink); font-weight: 700; }
    .post .body { margin-top: 0.5rem; color: rgba(255,255,255,0.75); font-size: 0.95rem; }
    .loading { color: rgba(255,255,255,0.6); text-align: center; grid-column: 1/-1; }
    footer {
      text-align: center; padding: 2rem 1rem; color: rgba(255,255,255,0.5);
      border-top: 1px solid rgba(255, 46, 136, 0.25); font-size: 0.85rem; letter-spacing: 1px;
    }
    footer span { color: var(--pink); }
    @media (max-width: 600px) {
      nav { padding: 0.9rem 1rem; }
      .hero { padding: 2.5rem 1rem 1.5rem; }
      .container { padding: 1.25rem 1rem 3rem; }
    }
  </style>
</head>
<body>
  <div class="sunset"></div>
  <div class="grid-lines"></div>

  <nav>
    <a href="/" class="logo">VICE/BLOG</a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/blog" class="active">Blog</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <span class="kicker">Leonida Stories</span>
    <h1>Vice<br>City Blog</h1>
    <p>Dispatches from the neon streets — Docker, CI/CD & EC2.</p>
  </section>

  <div class="container">
    <div id="posts"><p class="loading">Loading stories from the city…</p></div>
  </div>

  <footer>
    <p>&copy; 2026 <span>VICE/BLOG</span> — WELCOME TO LEONIDA</p>
  </footer>

  <script>
    fetch('/api/posts')
      .then(res => res.json())
      .then(posts => {
        document.getElementById('posts').innerHTML = posts.map(p => `
          <article class="post">
            <h2>${p.title}</h2>
            <small>${p.date}</small>
            <p class="excerpt">${p.excerpt}</p>
            <p class="body">${p.content}</p>
          </article>
        `).join('');
      })
      .catch(() => {
        document.getElementById('posts').innerHTML = '<p class="loading">Failed to load stories.</p>';
      });
  </script>
</body>
</html>
